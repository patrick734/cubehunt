name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract and miner-engine tests
        working-directory: contracts
        run: npm ci --no-audit --no-fund && npx hardhat test
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck and build
        working-directory: app
        run: npm ci --no-audit --no-fund && npx tsc --noEmit && npm run build
